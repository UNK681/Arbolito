<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Quicksand:wght@500;600&display=swap" />
<title>Mi amor por ti</title>
<style>
/* ============ 1. VARIABLES ============ */
:root{ --fondo-a:#ffe6ea; --fondo-b:#ffcbd5; --texto:#a3144a; --acento:#d81b4f; --suelo:#2b2024; }

/* ============ 2. BASE ============ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  min-height:100dvh; overflow-x:hidden;
  background:linear-gradient(160deg,var(--fondo-a),var(--fondo-b)) fixed;
  color:var(--texto); font-family:'Quicksand',sans-serif; font-weight:500;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

/* ============ 3. ESCENA (texto a la izquierda, árbol a la derecha) ============ */
.escena{
  min-height:100dvh; width:min(100%,1000px); margin:0 auto;
  display:grid; grid-template-columns:1fr; grid-template-rows:42dvh 1fr;
  grid-template-areas:"arbol" "texto";
}
.arbol{grid-area:arbol; position:relative; border-bottom:3px solid var(--suelo)}
.arbol canvas{position:absolute; inset:0; width:100%; height:100%}

.texto{
  grid-area:texto; display:flex; flex-direction:column; justify-content:center; gap:18px;
  padding:22px clamp(20px,6vw,44px) 30px;
}
.mensaje p{font-size:clamp(1rem,3.6vw,1.2rem); line-height:1.55; margin-bottom:.9em; min-height:1.55em}
.mensaje .firma{text-align:right; font-weight:600; margin-bottom:0}
.escribiendo::after{content:"|"; margin-left:2px; animation:parpadeo .7s steps(2) infinite}
@keyframes parpadeo{50%{opacity:0}}

/* ============ 4. CONTADOR ============ */
.cuenta{
  font-size:clamp(1rem,3.8vw,1.25rem); line-height:1.5;
  opacity:0; transform:translateY(10px); transition:opacity 1.2s ease, transform 1.2s ease;
}
.cuenta.visible{opacity:1; transform:none}
.cuenta .intro{display:block; margin-bottom:2px}
.cuenta b{
  font:700 clamp(1.5rem,6vw,2.2rem)/1 'Playfair Display',serif; color:var(--acento);
  font-variant-numeric:tabular-nums; margin-left:.25em;
}
.cuenta b:first-of-type{margin-left:0}


/* ============ 5. PANTALLA ANCHA / CELULAR HORIZONTAL ============ */
@media (min-width:720px), (orientation:landscape) and (min-height:0){
  .escena{grid-template-columns:1fr 1fr; grid-template-rows:minmax(100dvh,auto); grid-template-areas:"texto arbol"}
  .arbol{border-bottom:none; margin-bottom:12dvh}
  .arbol::after{content:""; position:absolute; left:0; right:0; bottom:0; border-bottom:3px solid var(--suelo)}
  .texto{padding-top:26px; padding-bottom:calc(12dvh + 10px)}
}

/* ============ 6. MÚSICA ============ */
.pista-musica{
  position:fixed; z-index:30; top:calc(12px + env(safe-area-inset-top)); left:50%; translate:-50% 0;
  padding:8px 16px; border-radius:999px; font-size:.9rem; white-space:nowrap;
  background:rgba(255,255,255,.75); color:var(--texto); backdrop-filter:blur(4px);
  box-shadow:0 4px 14px rgba(163,20,74,.18); animation:latido 2.2s ease-in-out infinite; transition:opacity .6s;
}
.pista-musica.oculta{opacity:0; pointer-events:none; animation:none}
@keyframes latido{50%{transform:scale(1.05)}}
.musica-btn{
  position:fixed; z-index:30; top:calc(12px + env(safe-area-inset-top)); right:12px; width:44px; height:44px;
  border-radius:50%; border:none; font-size:1.2rem; cursor:pointer; display:grid; place-items:center;
  background:rgba(255,255,255,.75); box-shadow:0 4px 14px rgba(163,20,74,.18);
  opacity:0; pointer-events:none; transition:opacity .8s;
}
.musica-btn.visible{opacity:1; pointer-events:auto}
@media (prefers-reduced-motion:reduce){.escribiendo::after{animation:none}}
</style>
</head>
<body>

<p class="pista-musica" id="pistaMusica">Toca la pantalla para activar la música 🎵</p>
<button class="musica-btn" id="btnMusica" aria-label="Pausar o reanudar la música">🔊</button>

<main class="escena">
  <section class="arbol" id="arbol" aria-hidden="true">
    <canvas id="base"></canvas>   <!-- tronco y copa (se dibuja una vez) -->
    <canvas id="caida"></canvas>  <!-- corazones que caen (se redibuja siempre) -->
  </section>

  <section class="texto">
    <div class="mensaje" id="mensaje"></div>
    <p class="cuenta" id="cuenta">
      <span class="intro" id="intro"></span>
      <b id="d">0</b> días <b id="h">00</b> horas <b id="m">00</b> minutos <b id="s">00</b> segundos
    </p>
  </section>
</main>

<script>
/* ============ CONFIGURACIÓN (edita solo esta parte) ============ */
const CONFIG = {
  // Inicio del conteo: año, mes (1 a 12), día, hora y minuto
  inicio: { anio: 2026, mes: 8, dia: 9, hora: 0, minuto: 0 },
  intro: "Mi amor por ti comenzó hace…",
  mensaje: [
    "Quiero decirte algo sencillo: gracias por llegar a mi vida.",
    "Si pudiera elegir un lugar seguro, sería a tu lado.",
    "Cuanto más tiempo pasa, más me alegra haberte encontrado.",
  ],
  firma: "ATTE: Tu amor",
  velocidad: 45                 // milisegundos por letra
};

/* ============ UTILIDADES ============ */
const $ = (id) => document.getElementById(id);
const dos = (n) => String(n).padStart(2, "0");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;
const azar = (a, b) => a + Math.random() * (b - a);

/* ============ CONTADOR ============ */
const { anio, mes, dia, hora, minuto } = CONFIG.inicio;
const INICIO = new Date(anio, mes - 1, dia, hora, minuto, 0);   // hora local de quien abre la página

function actualizarCuenta() {
  const ms = Date.now() - INICIO;
  const t = Math.abs(ms);
  $("d").textContent = Math.floor(t / 864e5);
  $("h").textContent = dos(Math.floor(t / 36e5) % 24);
  $("m").textContent = dos(Math.floor(t / 6e4) % 60);
  $("s").textContent = dos(Math.floor(t / 1e3) % 60);
  $("intro").textContent = ms < 0 ? "Falta para comenzar…" : CONFIG.intro;
}
actualizarCuenta();
setInterval(actualizarCuenta, 1000);

/* ============ MÚSICA (original, compuesta con código) ============
   Estilo lo-fi suave y nostálgico, inspirado en el ambiente de ese tipo de
   canciones: guitarra con arpegios, bajo cálido, batería muy tranquila,
   eco soñador y un ligero ruido de vinilo. No es ninguna canción existente:
   la melodía y los acordes son originales. Se genera en vivo con Web Audio,
   así que no usa archivos y no pesa nada. */
const VOLUMEN = 0.8;   // 0 a 1

function crearMusica(ctx, volumen) {
  const BPM = 78, CORCHEA = 60 / BPM / 2, SWING = CORCHEA * 0.18;
  const hz = (n) => 440 * Math.pow(2, (n - 69) / 12);        // nota MIDI -> frecuencia
  const ACORDES = [                                           // Re m9 - Si b maj7 - Fa maj7 - La m7
    { bajo: 38, tonos: [50, 57, 60, 64, 65, 69], pad: [53, 57, 60, 64] },
    { bajo: 46, tonos: [50, 53, 57, 62, 65, 69], pad: [53, 57, 62] },
    { bajo: 41, tonos: [48, 57, 60, 64, 65, 69], pad: [53, 57, 60, 64] },
    { bajo: 45, tonos: [52, 55, 60, 64, 67, 72], pad: [57, 60, 64, 67] }
  ];
  const PATRONES = [[0, 2, 3, 2, 4, 3, 2, 1], [0, 2, 4, 3, 5, 4, 3, 2]];
  const HAT = [1, .4, .7, .4, 1, .4, .7, .5];

  /* ---- Salida: master (cálido) -> compresor -> bocinas ---- */
  const master = ctx.createGain(); master.gain.value = 0;
  const calido = ctx.createBiquadFilter(); calido.type = "lowpass"; calido.frequency.value = 8500;
  const comp = ctx.createDynamicsCompressor();
  master.connect(calido); calido.connect(comp); comp.connect(ctx.destination);
  const seco = ctx.createGain(); seco.gain.value = 0.85; seco.connect(master);

  /* Eco (reverb) y repeticiones suaves (delay) para el sonido soñador */
  const largo = Math.floor(ctx.sampleRate * 2.8), imp = ctx.createBuffer(2, largo, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = imp.getChannelData(c);
    for (let i = 0; i < largo; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / largo, 2.4);
  }
  const reverb = ctx.createConvolver(); reverb.buffer = imp;
  const oscuro = ctx.createBiquadFilter(); oscuro.type = "lowpass"; oscuro.frequency.value = 3000;
  const envio = ctx.createGain(); envio.gain.value = 0.45;
  envio.connect(reverb); reverb.connect(oscuro); oscuro.connect(master);
  const eco = ctx.createDelay(1); eco.delayTime.value = CORCHEA * 3;
  const retorno = ctx.createGain(); retorno.gain.value = 0.32;
  const apagado = ctx.createBiquadFilter(); apagado.type = "lowpass"; apagado.frequency.value = 2200;
  const ecoSalida = ctx.createGain(); ecoSalida.gain.value = 0.35;
  eco.connect(apagado); apagado.connect(retorno); retorno.connect(eco); apagado.connect(ecoSalida); ecoSalida.connect(master);

  /* Batería: pasa por un filtro para que suene apagada, estilo lo-fi */
  const bateria = ctx.createGain(); bateria.gain.value = 0.55;
  const opaco = ctx.createBiquadFilter(); opaco.type = "lowpass"; opaco.frequency.value = 4800;
  bateria.connect(opaco); opaco.connect(master);
  const largoRuido = ctx.sampleRate, ruido = ctx.createBuffer(1, largoRuido, ctx.sampleRate);
  const dr = ruido.getChannelData(0); for (let i = 0; i < largoRuido; i++) dr[i] = Math.random() * 2 - 1;

  /* ---- Instrumentos ---- */
  function guitarra(n, t, vel, dur) {            // cuerda pulsada: ataque brillante que se apaga
    const f = hz(n), lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 1;
    lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(520, t + 0.35);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel * 0.2, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    [["sawtooth", .3], ["sine", .6]].forEach(([tipo, amp]) => {
      const o = ctx.createOscillator(); o.type = tipo; o.frequency.value = f;
      const a = ctx.createGain(); a.gain.value = amp; o.connect(a); a.connect(lp); o.start(t); o.stop(t + dur + 0.1);
    });
    lp.connect(g); g.connect(seco); g.connect(envio); g.connect(eco);
  }
  function bajo(n, t, vel, dur) {
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vel * 0.4, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    [["sine", 1], ["triangle", .35]].forEach(([tipo, amp]) => {
      const o = ctx.createOscillator(); o.type = tipo; o.frequency.value = hz(n);
      const a = ctx.createGain(); a.gain.value = amp; o.connect(a); a.connect(lp); o.start(t); o.stop(t + dur + 0.1);
    });
    lp.connect(g); g.connect(seco);
  }
  function colchon(notas, t, dur) {              // acordes largos de fondo
    notas.forEach((n) => [-6, 6].forEach((det) => {
      const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = hz(n); o.detune.value = det;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 800;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.03, t + 1.6);
      g.gain.setValueAtTime(0.03, t + dur - 1.2); g.gain.linearRampToValueAtTime(0.0001, t + dur + 1.2);
      o.connect(lp); lp.connect(g); g.connect(seco); g.connect(envio); o.start(t); o.stop(t + dur + 1.3);
    }));
  }
  function bombo(t) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine";
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g); g.connect(bateria); o.start(t); o.stop(t + 0.35);
  }
  function caja(t) {
    const s = ctx.createBufferSource(); s.buffer = ruido;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1900; bp.Q.value = .8;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
    s.connect(bp); bp.connect(g); g.connect(bateria); g.connect(envio); s.start(t, Math.random() * .5); s.stop(t + 0.2);
  }
  function platillo(t, vel) {
    const s = ctx.createBufferSource(); s.buffer = ruido;
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 6500;
    const g = ctx.createGain(); g.gain.setValueAtTime(vel * 0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(hp); hp.connect(g); g.connect(bateria); s.start(t, Math.random() * .5); s.stop(t + 0.08);
  }

  /* ---- Programación de notas, paso a paso ---- */
  let paso = 0, inicio = null;
  return {
    /* Entra poco a poco y deja sonando un ligero ruido de vinilo */
    entrar() {
      master.gain.linearRampToValueAtTime(volumen, ctx.currentTime + 3.5);
      const n = ctx.sampleRate * 2, v = ctx.createBuffer(1, n, ctx.sampleRate), d = v.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * 0.02 + (Math.random() < 0.0009 ? (Math.random() * 2 - 1) * 0.6 : 0);
      const fuente = ctx.createBufferSource(); fuente.buffer = v; fuente.loop = true;
      const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 900;
      const g = ctx.createGain(); g.gain.value = 0.05;
      fuente.connect(f); f.connect(g); g.connect(master); fuente.start();
    },
    /* Programa todas las notas hasta el instante `hasta` (reloj de audio, en segundos) */
    programarHasta(hasta) {
      if (inicio === null) inicio = ctx.currentTime + 0.2;
      while (inicio + paso * CORCHEA < hasta) {
        const t = inicio + paso * CORCHEA + (paso % 2 ? SWING : 0);       // swing en las corcheas impares
        const ac = ACORDES[Math.floor(paso / 16) % 4];
        const compas = Math.floor(paso / 8) % 2, pos = paso % 8;
        if (paso % 16 === 0) colchon(ac.pad, t, 16 * CORCHEA);
        if (pos === 0) bajo(ac.bajo, t, 1, 2.4);
        if (pos === 5 && compas === 1) bajo(ac.bajo + 7, t, .6, 1.2);
        if (Math.random() < 0.88) guitarra(ac.tonos[PATRONES[compas][pos]], t, .55 + Math.random() * .4, 2.2);
        if (pos === 0 || (pos === 5 && compas === 1)) bombo(t);
        if (pos === 2 || pos === 6) caja(t);
        if (Math.random() < 0.92) platillo(t, HAT[pos]);
        paso++;
      }
    }
  };
}

let audioCtx = null, musica = null;
const btnMusica = $("btnMusica"), pista = $("pistaMusica");

function iniciarMusica() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  musica = crearMusica(audioCtx, VOLUMEN);
  setInterval(() => musica.programarHasta(audioCtx.currentTime + 1.5), 200);
  audioCtx.resume();
  musica.entrar();
  pista.classList.add("oculta");
  btnMusica.classList.add("visible");
}
btnMusica.addEventListener("click", (e) => {
  e.stopPropagation();
  if (audioCtx.state === "running") { audioCtx.suspend(); btnMusica.textContent = "🔇"; }
  else { audioCtx.resume(); btnMusica.textContent = "🔊"; }
});

/* ============ ÁRBOL DE CORAZONES ============ */
const base = $("base"), caida = $("caida");
const cb = base.getContext("2d"), cf = caida.getContext("2d");
const COLORES = ["#e0314b", "#ff5d73", "#ff8fa3", "#c9184a", "#ff4d6d", "#ffb3c1", "#f06a86"];
const TOTAL = 950;                                       // corazones de la copa
let W = 0, H = 0, K = 1, cx = 0, cy = 0, suelo = 0;      // medidas de la escena
let reveladas = 0;                                       // cuántos corazones ya aparecieron
const copa = Array.from({ length: TOTAL }, () => ({
  t: azar(0, Math.PI * 2), r: Math.sqrt(Math.random()) * azar(.85, 1.02),
  tam: azar(.8, 1.6), rot: azar(-.6, .6), color: COLORES[Math.floor(Math.random() * COLORES.length)]
}));
let cayendo = [];

function corazon(ctx, x, y, s, rot, color, alfa = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = alfa; ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, s * .6);
  ctx.bezierCurveTo(-s, -s * .1, -s * .55, -s * .9, 0, -s * .35);
  ctx.bezierCurveTo(s * .55, -s * .9, s, -s * .1, 0, s * .6);
  ctx.fill(); ctx.restore();
}

/* Posición de un corazón dentro de la silueta de corazón (ecuación paramétrica) */
function posicion(c) {
  const t = c.t;
  const px = 16 * Math.pow(Math.sin(t), 3);
  const py = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return { x: cx + c.r * px * K, y: cy - (c.r * py + 2.7) * K };
}

function tronco() {
  cb.fillStyle = "#6b3a1e"; cb.strokeStyle = "#6b3a1e"; cb.lineCap = "round";
  cb.beginPath();
  cb.moveTo(cx - K * 1.9, suelo); cb.quadraticCurveTo(cx - K * .5, suelo - K * 7, cx - K * .8, cy + K * 4);
  cb.lineTo(cx + K * .8, cy + K * 4); cb.quadraticCurveTo(cx + K * .5, suelo - K * 7, cx + K * 1.9, suelo);
  cb.fill();
  cb.lineWidth = K * .55;                                  // ramas que se asoman entre los corazones
  [[-7, -3], [7, -4.5], [-3, -8], [3.5, -9]].forEach(([dx, dy]) => {
    cb.beginPath(); cb.moveTo(cx, cy + K * 4.5); cb.lineTo(cx + dx * K, cy + dy * K); cb.stroke();
  });
}

function medir() {                                         // ajusta los lienzos al tamaño real
  const caja = $("arbol").getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  W = caja.width; H = caja.height;
  [base, caida].forEach((c) => { c.width = W * dpr; c.height = H * dpr; c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0); });
  K = Math.min(W / 36, H * .6 / 29); cx = W / 2; cy = H * .37; suelo = H;
  cb.clearRect(0, 0, W, H); tronco();
  for (let i = 0; i < reveladas; i++) { const p = posicion(copa[i]); corazon(cb, p.x, p.y, copa[i].tam * K * .9, copa[i].rot, copa[i].color, .92); }
}

function fotograma(ahora) {
  const velocidad = reducir ? TOTAL : 3;                   // corazones nuevos por fotograma
  for (let n = 0; n < velocidad && reveladas < TOTAL; n++, reveladas++) {
    const c = copa[reveladas], p = posicion(c);
    corazon(cb, p.x, p.y, c.tam * K * .9, c.rot, c.color, .92);
  }
  if (!reducir && reveladas > TOTAL * .55 && Math.random() < .07) {   // sueltan un corazón de vez en cuando
    const p = posicion(copa[Math.floor(Math.random() * TOTAL)]);
    cayendo.push({ x: p.x, y: p.y, vy: azar(.5, 1.3), fase: azar(0, 6), amp: azar(.3, .9), s: azar(.5, 1.1) * K,
                   rot: 0, vr: azar(-.03, .03), color: COLORES[Math.floor(Math.random() * COLORES.length)], alfa: 1 });
  }
  cf.clearRect(0, 0, W, H);
  cayendo = cayendo.filter((h) => h.alfa > 0);
  cayendo.forEach((h) => {
    h.y += h.vy; h.fase += .03; h.x += Math.sin(h.fase) * h.amp; h.rot += h.vr;
    if (h.y > suelo - h.s) h.alfa -= .03;                  // al llegar al suelo se desvanece
    corazon(cf, h.x, h.y, h.s, h.rot, h.color, Math.max(0, h.alfa));
  });
  requestAnimationFrame(fotograma);
}
medir();
addEventListener("resize", medir);
requestAnimationFrame(fotograma);

/* ============ MENSAJE ESCRITO A MÁQUINA ============ */
let saltar = reducir;
async function escribir() {
  const bloques = [...CONFIG.mensaje.map((t) => ({ clase: "", texto: t })), { clase: "firma", texto: CONFIG.firma }];
  await sleep(reducir ? 0 : 1200);
  for (const { clase, texto } of bloques) {
    const p = document.createElement("p");
    p.className = clase; $("mensaje").append(p); p.classList.add("escribiendo");
    for (const letra of texto) {
      if (saltar) { p.textContent = texto; break; }
      p.textContent += letra;
      await sleep(/[.,;:!?…]/.test(letra) ? CONFIG.velocidad * 6 : CONFIG.velocidad);
    }
    p.classList.remove("escribiendo");
    await sleep(saltar ? 0 : 350);
  }
  $("cuenta").classList.add("visible");                    // el contador aparece al terminar
}
/* El primer toque activa la música (los celulares lo exigen); los siguientes muestran todo el mensaje */
document.addEventListener("click", () => {
  if (!audioCtx) { iniciarMusica(); return; }
  saltar = true;
});
escribir();
</script>
</body>
</html>
